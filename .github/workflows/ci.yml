# Auditoría, typecheck y lint en cada PR y en cada push a main. Los tests contra la base se corren
# a mano antes de cada PR, con la base local (D-048): la CI no usa Neon ni secretos.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint

